name: Update Podcast Charts

on:
  schedule:
    - cron: '0 8 * * *'   # runs every day at 08:00 UTC (staggered from other jobs)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch podcast charts
        run: node scripts/fetch-charts.js

      - name: Commit updated data
        run: |
          git config user.name "podcast-bot"
          git config user.email "actions@github.com"
          git add docs/data/charts.json docs/data/chart-history.json
          git diff --staged --quiet || git commit -m "Update podcast charts $(date -u +'%Y-%m-%d')"
          git push
