name: Update YouTube Feed

on:
  schedule:
    - cron: '0 7 * * *'   # runs every day at 07:00 UTC (staggered from the podcast job)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.js

      - name: Commit updated data
        run: |
          git config user.name "podcast-bot"
          git config user.email "actions@github.com"
          git add docs/data/videos.json
          git diff --staged --quiet || git commit -m "Update YouTube videos $(date -u +'%Y-%m-%d')"
          git push
