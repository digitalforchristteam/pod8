name: Update Podcast Feed

on:
  schedule:
    - cron: '0 6 * * *'   # runs every day at 06:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest podcast episodes
        run: npm run fetch

      - name: Commit updated data
        run: |
          git config user.name "podcast-bot"
          git config user.email "actions@github.com"
          git add docs/data/episodes.json
          git diff --staged --quiet || git commit -m "Update podcast episodes $(date -u +'%Y-%m-%d')"
          git push
